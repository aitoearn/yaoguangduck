<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1440px; overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#FDF6EC; color:#1F1D1B;
    padding:64px 80px; display:flex; flex-direction:column;
  }
  .badge {
    display:inline-flex; align-items:center; gap:10px; align-self:flex-start;
    background:#1F1D1B; color:#FFD8A8; font-size:26px; font-weight:600;
    padding:14px 28px; border-radius:100px; letter-spacing:2px;
  }
  h1 { font-size:74px; line-height:1.18; font-weight:800; margin-top:36px; letter-spacing:-2px; }
  h1 em { font-style:normal; color:#E8722C; }
  .sub { font-size:30px; color:#7A736C; margin-top:18px; letter-spacing:1px; }
  .hero {
    margin-top:48px; background:#FFFFFF; border-radius:36px; padding:48px 56px 44px;
    box-shadow:0 12px 40px rgba(180,140,90,.14); position:relative; overflow:hidden; flex:none;
  }
  .hero:after {
    content:""; position:absolute; right:-70px; top:-70px; width:230px; height:230px;
    background:#FFEFD9; border-radius:50%;
  }
  .hero .label { font-size:28px; color:#9A9188; letter-spacing:3px; }
  .hero .amount {
    font-size:124px; font-weight:800; line-height:1; margin-top:16px; letter-spacing:-5px;
    color:#1F1D1B;
  }
  .hero .amount span { font-size:52px; font-weight:700; margin-left:12px; letter-spacing:0; }
  .hero .note { font-size:25px; color:#9A9188; margin-top:18px; }
  .stats { display:flex; gap:28px; margin-top:44px; flex:none; }
  .stat {
    flex:1; background:#FFFFFF; border-radius:28px; padding:34px 30px;
    box-shadow:0 8px 26px rgba(180,140,90,.10); position:relative; z-index:1;
  }
  .stat b { display:block; font-size:52px; font-weight:800; letter-spacing:-1px; }
  .stat b i { font-size:26px; font-style:normal; font-weight:600; color:#8A8279; margin-left:6px; }
  .stat span { display:block; font-size:24px; color:#9A9188; margin-top:10px; letter-spacing:1px; }
  .bars { margin-top:40px; flex:none; }
  .bars .t { font-size:26px; color:#8A8279; letter-spacing:2px; margin-bottom:26px; }
  .bar { margin-bottom:26px; }
  .bar .row { display:flex; justify-content:space-between; font-size:30px; font-weight:600; margin-bottom:12px; }
  .bar .row i { font-style:normal; color:#E8722C; font-weight:800; }
  .bar .track { height:16px; background:#F1E4D3; border-radius:100px; overflow:hidden; }
  .bar .fill { height:100%; border-radius:100px; background:linear-gradient(90deg,#F6A44A,#E8722C); }
  .foot { margin-top:auto; flex:none; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#A79E94; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="badge">🦆 DAY 1 · 采购收官</div>
  <h1>不买官方 399 刀<br>用 <em>3263</em> 元攒一只机器鸭</h1>
  <div class="sub">开源机器鸭 MicroDuck · 新手照抄清单</div>

  <div class="hero">
    <div class="label">TOTAL / 总投入</div>
    <div class="amount">¥3263<span>元</span></div>
    <div class="note">含工具与备件，工具类后续可复用</div>
  </div>

  <div class="stats">
    <div class="stat"><b>15<i>颗</i></b><span>串口总线舵机</span></div>
    <div class="stat"><b>26<i>笔</i></b><span>有效订单</span></div>
    <div class="stat"><b>3<i>阶段</i></b><span>已过 1/5</span></div>
  </div>

  <div class="bars">
    <div class="t">三大开销 / 占总预算 68%</div>
    <div class="bar">
      <div class="row"><span>舵机 HD-1910 ×15</span><i>¥1425</i></div>
      <div class="track"><div class="fill" style="width:100%"></div></div>
    </div>
    <div class="bar">
      <div class="row"><span>主控 Radxa ZERO 3W + 摄像头</span><i>¥564</i></div>
      <div class="track"><div class="fill" style="width:40%"></div></div>
    </div>
    <div class="bar">
      <div class="row"><span>HAT + IMU 扩展板（成品）</span><i>¥218</i></div>
      <div class="track"><div class="fill" style="width:15%"></div></div>
    </div>
  </div>

  <div class="foot"><span>清单整理自社区复刻方案 · 2026.10</span><span>Part 1 / 3</span></div>
</body>
</html>
